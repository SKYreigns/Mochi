[package]
name = "mochi"
version = "1.0.0"
description = "Mochi - your little AI companion"
authors = ["Mochi"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
